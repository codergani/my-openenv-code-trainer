spec_version: 1
name: my_assistant_bot
type: space
runtime: fastapi
app: server.app:app
port: 8000

tasks:
  - id: easy_coding
    name: "Easy Python Challenges"
    description: "Predict outputs and fix basic bugs."
    difficulty: easy
    grader: "my_assistant_bot.server.graders:grade_easy"
  - id: medium_coding
    name: "Medium Python Challenges"
    description: "Data structures and algorithms."
    difficulty: medium
    grader: "my_assistant_bot.server.graders:grade_medium"
  - id: hard_coding
    name: "Hard Python Challenges"
    description: "Advanced OOP and error handling."
    difficulty: hard
    grader: "my_assistant_bot.server.graders:grade_hard"
