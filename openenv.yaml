spec_version: 1
name: my_assistant_bot
type: space
runtime: fastapi
app: my_assistant_bot.server.app:app
port: 8000

tasks:
  - id: "task1"
    name: "Easy Challenges"
    category: "Easy"
    description: "Output prediction and basic bug fixing."
    difficulty: "Easy"
    grader: "my_assistant_bot.server.graders:grade_easy"
  - id: "task2"
    name: "Medium Challenges"
    category: "Medium"
    description: "Data structures and algorithm logic."
    difficulty: "Medium"
    grader: "my_assistant_bot.server.graders:grade_medium"
  - id: "task3"
    name: "Hard Challenges"
    category: "Hard"
    description: "Advanced OOP, generators, and error handling."
    difficulty: "Hard"
    grader: "my_assistant_bot.server.graders:grade_hard"
